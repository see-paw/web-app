name: E2E Tests - Playwright

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  DOTNET_VERSION: "8.0.x"
  NODE_VERSION: "lts/*"
  BACKEND_PORT: 5001
  FRONTEND_PORT: 3000

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # PostgreSQL service para o backend
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: seepaw
          POSTGRES_PASSWORD: seepawpwd
          POSTGRES_DB: seepaw
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # ============================================
      # 1️⃣ CHECKOUT REPOSITÓRIOS
      # ============================================
      - name: Checkout frontend (repositório atual)
        uses: actions/checkout@v4
        with:
          path: frontend

      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          repository: see-paw/backend
          ref: main
          path: backend
          token: ${{ secrets.GITHUB_TOKEN }}

      # ============================================
      # 2️⃣ SETUP FERRAMENTAS
      # ============================================
      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # ============================================
      # 3️⃣ GERAR CERTIFICADOS SSL SELF-SIGNED
      # ============================================
      - name: Gerar certificados SSL para desenvolvimento
        working-directory: frontend
        run: |
          echo "🔐 A gerar certificados SSL self-signed..."
          mkdir -p certs
          openssl req -x509 -newkey rsa:4096 -keyout certs/WebAPI.key -out certs/WebAPI.crt \
            -days 365 -nodes -subj "/CN=localhost"
          echo "✅ Certificados gerados"

      # ============================================
      # 4️⃣ CACHE DEPENDÊNCIAS
      # ============================================
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('backend/**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      # ============================================
      # 5️⃣ BACKEND - INSTALAR E COMPILAR
      # ============================================
      - name: Restaurar dependências do backend
        working-directory: backend
        run: dotnet restore backend.sln

      - name: Compilar backend
        working-directory: backend
        run: dotnet build backend.sln --no-restore --configuration Release

      # ============================================
      # 6️⃣ FRONTEND - INSTALAR DEPENDÊNCIAS
      # ============================================
      - name: Instalar dependências do frontend
        working-directory: frontend
        run: npm ci

      # ============================================
      # 7️⃣ BUILD FRONTEND PARA PRODUÇÃO
      # ============================================
      - name: Limpar artefactos de build anteriores
        working-directory: frontend
        run: |
          echo "🧹 A limpar ficheiros gerados anteriormente..."
          find src -name "*.d.ts" -type f ! -name "vite-env.d.ts" ! -name "css-modules.d.ts" -delete
          rm -rf dist/ .tsbuildinfo 2>/dev/null || true
          echo "✅ Limpeza concluída"

      - name: Build frontend para produção
        working-directory: frontend
        run: |
          echo "📦 A compilar frontend..."
          npm run build
          echo "✅ Build concluído"
          ls -lah dist/

      - name: Upload build do frontend
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist/
          retention-days: 7

      # ============================================
      # 8️⃣ PLAYWRIGHT - INSTALAR BROWSERS
      # ============================================
      - name: Instalar browsers do Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium firefox
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      # ============================================
      # 9️⃣ ARRANCAR BACKEND EM BACKGROUND
      # ============================================
      - name: Iniciar backend
        working-directory: backend
        env:
          ASPNETCORE_ENVIRONMENT: Testing
          ASPNETCORE_URLS: https://localhost:${{ env.BACKEND_PORT }}
          ConnectionStrings__DefaultConnection: ${{ secrets.DB_CONNECTION_STRING }}
          CloudinarySettings__CloudName: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CloudinarySettings__ApiKey: ${{ secrets.CLOUDINARY_API_KEY }}
          CloudinarySettings__ApiSecret: ${{ secrets.CLOUDINARY_API_SECRET }}
          JWT__Issuer: ${{ secrets.JWT_ISSUER }}
          JWT__Audience: ${{ secrets.JWT_AUDIENCE }}
          JWT__SigningKey: ${{ secrets.JWT_SIGNING_KEY }}
        run: |
          echo "🚀 A iniciar backend na porta ${{ env.BACKEND_PORT }}..."
          dotnet run --project WebAPI/WebAPI.csproj --no-build --configuration Release > backend.log 2>&1 &
          echo $! > backend_pid.txt
          echo "✅ Backend iniciado (PID: $(cat backend_pid.txt))"

      - name: Aguardar backend estar pronto (healthcheck)
        run: |
          echo "⏳ A aguardar backend em https://localhost:${{ env.BACKEND_PORT }}..."
          max_attempts=30
          attempt=0
          
          while [ $attempt -lt $max_attempts ]; do
            if curl -k -s https://localhost:${{ env.BACKEND_PORT }}/health > /dev/null 2>&1; then
              echo "✅ Backend está pronto!"
              exit 0
            fi
          
            attempt=$((attempt + 1))
            echo "Tentativa $attempt/$max_attempts - Backend ainda não está pronto..."
            sleep 2
          done
          
          echo "❌ Backend não respondeu após $max_attempts tentativas"
          echo "📄 Últimas 50 linhas do log do backend:"
          tail -n 50 backend/backend.log || true
          exit 1

      # ============================================
      # 🔟 SERVIR BUILD DE PRODUÇÃO COM HTTPS
      # ============================================
      - name: Servir build de produção com HTTPS
        working-directory: frontend
        run: |
          echo "🚀 A servir build de produção com HTTPS na porta ${{ env.FRONTEND_PORT }}..."
          npx vite preview --port ${{ env.FRONTEND_PORT }} --https --host > frontend.log 2>&1 &
          echo $! > frontend_pid.txt
          echo "✅ Frontend servido (PID: $(cat frontend_pid.txt))"

      - name: Aguardar frontend estar pronto (healthcheck)
        run: |
          echo "⏳ A aguardar frontend em https://localhost:${{ env.FRONTEND_PORT }}..."
          max_attempts=30
          attempt=0
          
          while [ $attempt -lt $max_attempts ]; do
            if curl -k -s https://localhost:${{ env.FRONTEND_PORT }} > /dev/null 2>&1; then
              echo "✅ Frontend está pronto!"
              exit 0
            fi
          
            attempt=$((attempt + 1))
            echo "Tentativa $attempt/$max_attempts - Frontend ainda não está pronto..."
            sleep 2
          done
          
          echo "❌ Frontend não respondeu após $max_attempts tentativas"
          echo "📄 Últimas 50 linhas do log do frontend:"
          tail -n 50 frontend/frontend.log || true
          exit 1

      # ============================================
      # 1️⃣1️⃣ EXECUTAR TESTES E2E
      # ============================================
      - name: Executar testes E2E com Playwright
        working-directory: frontend
        env:
          CI: true
          NODE_TLS_REJECT_UNAUTHORIZED: 0
        run: |
          echo "┏━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┓"
          echo "   🎭 TESTES E2E - PLAYWRIGHT"
          echo "┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛"
          echo ""
          npx playwright test --reporter=html,list

      # ============================================
      # 1️⃣2️⃣ UPLOAD ARTEFACTOS (SEMPRE)
      # ============================================
      - name: Upload relatório Playwright
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Upload traces e screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-traces
          path: frontend/test-results/
          retention-days: 7

      # ============================================
      # 1️⃣3️⃣ LOGS DE DEBUG (SE FALHAR)
      # ============================================
      - name: Upload logs do backend (se falhar)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: backend-logs
          path: backend/backend.log
          retention-days: 3

      - name: Upload logs do frontend (se falhar)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: frontend-logs
          path: frontend/frontend.log
          retention-days: 3

      # ============================================
      # 1️⃣4️⃣ CLEANUP
      # ============================================
      - name: Parar servidores
        if: always()
        run: |
          echo "🧹 A encerrar servidores..."
          kill $(cat backend/backend_pid.txt) 2>/dev/null || true
          kill $(cat frontend/frontend_pid.txt) 2>/dev/null || true
          echo "✅ Cleanup concluído"