####################################################################################################################
# WARNING: Do not store sensitive information in this file, as its contents will be included in the Qodana report. #
####################################################################################################################
version: "1.0"

linter: jetbrains/qodana-js:latest
profile:
  name: qodana.recommended
exclude:
  - name: Eslint
  - name: Syntax errors and unresolved references in JSDoc
  - name: Unresolved variable or type 'JSX'
  - name: Unresolved variable or type 'Element'