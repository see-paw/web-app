version: "1.0"

linter: jetbrains/qodana-js:2025.2
profile:
  name: qodana.recommended
exclude:
  - name: Eslint
  - name: JSValidateJSDoc

  - name: JSXUnresolvedComponent
  - name: JSXUnresolvedElement
  - name: JSXUnresolvedVariable

  - name: JSUnresolvedVariable
  - name: UnusedImport
  - name: VoidFunctionReturnValueUsed
  - name: RedundantAwait
  - name: All
    paths:
      - e2e